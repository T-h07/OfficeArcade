spring:
  application:
    name: officearcade-server
  datasource:
    url: jdbc:postgresql://localhost:55432/officearcade
    username: officearcade
    password: officearcade
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${OFFICEARCADE_SERVER_PORT:18180}

officearcade:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:1420
      - http://127.0.0.1:1420
  auth:
    jwt:
      issuer: officearcade-server
      secret: dev-officearcade-jwt-secret-change-before-production-2026-pt02
      access-token-ttl-minutes: 480
  play-limits:
    daily-game-limit: 5
    cooldown-minutes: 90
    timezone: Europe/Berlin
